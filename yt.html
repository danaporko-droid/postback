<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>18+ Она онлайн</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:#07060b;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,45,149,.45),transparent 28%),radial-gradient(circle at 50% 80%,rgba(120,40,255,.28),transparent 32%),#07060b}
.pulse{position:fixed;left:50%;top:46%;width:280px;height:280px;border-radius:50%;border:1px solid rgba(255,45,149,.45);transform:translate(-50%,-50%);animation:ring 2.2s ease-out infinite}
.pulse.d2{animation-delay:.7s}.pulse.d3{animation-delay:1.4s}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.55);opacity:.7}to{transform:translate(-50%,-50%) scale(1.7);opacity:0}}
.box{position:relative;z-index:1;width:min(420px,92vw);text-align:center;padding:12px}
.age{display:inline-block;margin-bottom:14px;padding:6px 12px;border-radius:999px;background:rgba(255,45,149,.16);border:1px solid rgba(255,45,149,.4);color:#ffb3d8;font-size:13px;letter-spacing:1px}
h1{font-size:34px;line-height:1.15;margin-bottom:10px}
p{color:#d9cfe2;font-size:16px;line-height:1.4;margin-bottom:22px}
.go{position:relative;width:100%;border:0;border-radius:999px;padding:18px 20px;font-size:18px;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(90deg,#ff2d95,#e11d48);box-shadow:0 12px 40px rgba(255,45,149,.45);animation:bump 1.3s ease-in-out infinite}
@keyframes bump{50%{transform:scale(1.04)}}
.live{margin-top:14px;color:#b9adc4;font-size:13px}
.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#39e58c;margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="pulse"></div><div class="pulse d2"></div><div class="pulse d3"></div>
<div class="box">
  <div class="age">18+</div>
  <h1 id="title">Она онлайн в твоём городе</h1>
  <p id="sub">Фото уже открыто. Место держится пару минут.</p>
  <button class="go" id="go" type="button">Открыть сейчас</button>
  <div class="live"><i></i><span id="live">128 смотрят это сообщение</span></div>
</div>
<script>
const OFFER="https://spope.top/click?o=2&a=4444";
let city="твоём городе", sent=false;
const mobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
function paint(){
  document.getElementById("title").textContent="Она онлайн в "+city;
  document.getElementById("sub").textContent=mobile?"Написала с телефона. Открой, пока не пропала.":"Фото уже открыто. Место держится пару минут.";
  document.getElementById("live").textContent=(96+Math.floor(Math.random()*40))+" смотрят в "+city;
}
function openOffer(){
  if(sent) return;
  sent=true;
  const q=new URLSearchParams(location.search);
  const url=new URL(OFFER);
  url.searchParams.set("sub1", q.get("src")||"youtube");
  url.searchParams.set("sub2", q.get("c")||"onebtn");
  url.searchParams.set("sub3", (city+"|"+(mobile?"mobile":"desktop")).slice(0,80));
  location.href=url.toString();
}
document.getElementById("go").onclick=openOffer;
document.body.onclick=function(e){ if(e.target.id!=="go") openOffer(); };
paint();
fetch("https://ipwho.is/").then(r=>r.json()).then(function(d){ if(d&&d.city){ city=d.city; paint(); } }).catch(function(){});
</script>
</body>
</html>
