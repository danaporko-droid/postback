    function detectLang() {
      const nav = (navigator.language || navigator.userLanguage || "en").toLowerCase();
      if (nav.startsWith("ru")) return "ru";
      if (nav.startsWith("uk")) return "uk";
      if (nav.startsWith("es")) return "es";
      if (nav.startsWith("de")) return "de";
      if (nav.startsWith("fr")) return "fr";
      if (nav.startsWith("pt")) return "pt";
      if (nav.startsWith("it")) return "it";
      if (nav.startsWith("pl")) return "pl";
      if (nav.startsWith("tr")) return "tr";
      if (nav.startsWith("ar")) return "ar";
      return "en";
    }
    let currentLang = detectLang();
    function applyLang(lang) {
      const t = texts[lang] || texts.en;
      document.getElementById("title").textContent = t.title;
      document.getElementById("subtitle").textContent = t.subtitle;
      document.getElementById("cta").textContent = t.cta;

      document.getElementById("footer").textContent = t.footer;
      document.getElementById("langLabel").textContent = t.label;
      document.documentElement.lang = lang;
      currentLang = lang;
      document.body.style.direction = lang === "ar" ? "rtl" : "ltr";
    }
    function toggleLang() {
      const order = ["en", "ru", "uk", "es", "de", "fr", "pt", "it", "pl", "tr", "ar"];
      applyLang(order[(order.indexOf(currentLang) + 1) % order.length]);
    }
    function sourceName() {
      const q = new URLSearchParams(location.search);
      const tagged = q.get("src") || q.get("utm_source") || q.get("sub1");
      if (tagged) return tagged.slice(0, 80);
      let host = "";
      try { host = new URL(document.referrer).hostname; } catch (e) {}
      if (!host) return "direct";
      if (/t\\.co|twitter|x\\.com/.test(host)) return "x";
      if (/youtube|youtu\\.be/.test(host)) return "youtube";
      return host.slice(0, 80);
    }
    function offerUrl() {
      const incoming = new URLSearchParams(location.search);
      const url = new URL(OFFER);
      incoming.forEach(function (value, key) {
        if (!url.searchParams.has(key)) url.searchParams.set(key, value.slice(0, 120));
      });
      url.searchParams.set("sub1", sourceName());
      url.searchParams.set("sub2", (incoming.get("c") || incoming.get("utm_campaign") || "main").slice(0, 80));
      url.searchParams.set("sub3", (document.referrer || "none").slice(0, 180));
      return url.toString();
    }
    applyLang(currentLang);
    document.getElementById("cta").href = offerUrl();
    document.getElementById("cta").addEventListener("click", function () {

      if (typeof gtag === "function") {
