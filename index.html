<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #1a0a1a 0%, #0a0a0a 70%); }
    .container { width: 100%; max-width: 420px; padding: 24px 20px; text-align: center; }
    .logo { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: #ff2d95; margin-bottom: 28px; }
    .avatar { width: 140px; height: 140px; border-radius: 50%; margin: 0 auto 28px; background: linear-gradient(145deg, #ff2d95, #9b00ff); padding: 4px; }
    .avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: #1a0a1a; display: flex; align-items: center; justify-content: center; font-size: 64px; }
    h1 { font-size: 26px; font-weight: 700; line-height: 1.3; margin-bottom: 12px; }
    .subtitle { font-size: 16px; color: #ccc; line-height: 1.5; margin-bottom: 32px; }
    .cta { display: block; width: 100%; border: 0; background: linear-gradient(90deg, #ff2d95, #e60073); color: #fff; font-size: 18px; font-weight: 700; padding: 18px 24px; border-radius: 50px; margin-bottom: 20px; cursor: pointer; }
    .features { display: flex; justify-content: center; gap: 18px; margin-bottom: 28px; flex-wrap: wrap; }
    .feature { font-size: 13px; color: #aaa; }
    .age-tags { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 32px; }
    .tag { background: rgba(255, 45, 149, 0.15); border: 1px solid rgba(255, 45, 149, 0.4); color: #ff9ec8; font-size: 13px; padding: 6px 14px; border-radius: 20px; }
    .footer { font-size: 12px; color: #666; line-height: 1.5; max-width: 320px; margin: 0 auto; }
    .lang-switch { position: fixed; top: 16px; right: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; font-size: 13px; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="lang-switch" onclick="toggleLang()">🌐 <span id="langLabel">EN</span></div>
  <div class="container">
    <div class="logo">ADULT DATING</div>
    <div class="avatar"><div class="avatar-inner">🔥</div></div>
    <h1 id="title">Hot girls are waiting for you</h1>
    <p class="subtitle" id="subtitle">Real women nearby. No games. Direct contact.</p>
    <div class="age-tags"><div class="tag">18–25</div><div class="tag">26–35</div><div class="tag">36–45</div><div class="tag">45+</div></div>
    <button class="cta" id="cta" type="button">START CHATTING 🔥</button>
    <div class="features">
      <div class="feature"><span id="f1">100% free</span></div>
      <div class="feature"><span id="f2">Real profiles</span></div>
      <div class="feature"><span id="f3">Instant access</span></div>
    </div>
    <p class="footer" id="footer">By continuing you confirm that you are 18+ and agree to the terms of the service.</p>
  </div>
  <script>
    const OFFER = "https://spope.top/click?o=2&a=4444";
    const texts = {
      en: { title: "Hot girls are waiting for you", subtitle: "Real women nearby. No games. Direct contact.", cta: "START CHATTING 🔥", f1: "100% free", f2: "Real profiles", f3: "Instant access", footer: "By continuing you confirm that you are 18+ and agree to the terms of the service.", label: "EN" },
      ru: { title: "Горячие девушки ждут тебя", subtitle: "Реальные женщины рядом. Без игр. Прямой контакт.", cta: "НАЧАТЬ ОБЩЕНИЕ 🔥", f1: "100% бесплатно", f2: "Реальные анкеты", f3: "Мгновенный доступ", footer: "Продолжая, вы подтверждаете, что вам есть 18 лет, и соглашаетесь с правилами сервиса.", label: "RU" }
    };
    function detectLang() {
      return (navigator.language || "en").toLowerCase().startsWith("ru") ? "ru" : "en";
    }
    let currentLang = detectLang();
    function applyLang(lang) {
      const t = texts[lang] || texts.en;
      document.getElementById("title").textContent = t.title;
      document.getElementById("subtitle").textContent = t.subtitle;
      document.getElementById("cta").textContent = t.cta;
      document.getElementById("f1").textContent = t.f1;
      document.getElementById("f2").textContent = t.f2;
      document.getElementById("f3").textContent = t.f3;
      document.getElementById("footer").textContent = t.footer;
      document.getElementById("langLabel").textContent = t.label;
      currentLang = lang;
    }
    function toggleLang() { applyLang(currentLang === "ru" ? "en" : "ru"); }
    function offerUrl() {
      const incoming = new URLSearchParams(location.search);
      const url = new URL(OFFER);
      const src = incoming.get("src") || incoming.get("utm_source") || "direct";
      url.searchParams.set("sub1", src.slice(0, 80));
      url.searchParams.set("sub2", (incoming.get("c") || "main").slice(0, 80));
      return url.toString();
    }
    let sent = false;
    applyLang(currentLang);
    document.getElementById("cta").addEventListener("click", function () {
      if (sent) return;
      sent = true;
      location.href = offerUrl();
    });
  </script>
</body>
</html>
